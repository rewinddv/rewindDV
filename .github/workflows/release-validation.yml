name: Release tooling validation

on:
  pull_request:
    paths: ['tools/**', 'RELEASING.md', '.github/workflows/release-validation.yml', '.github/ISSUE_TEMPLATE/**', 'TEST-REPORT.md']
  push:
    branches: [main]
    paths: ['tools/**', 'RELEASING.md', '.github/workflows/release-validation.yml', '.github/ISSUE_TEMPLATE/**', 'TEST-REPORT.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Release provenance and artifact regression tests
        run: |
          python3 -B tools/test_release_candidate.py
          python3 -B tools/test_signed_release.py
          python3 -B Foundation/Tools/test-developer-id-verification.py
      - name: Existing disclosure-checker regression tests
        run: python3 -B tools/test-publication-content.py

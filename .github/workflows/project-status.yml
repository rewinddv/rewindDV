name: Project status and source parity
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B tools/test_project_status.py
      - run: python3 -B tools/project_status.py
      - name: Verify newest public download
        if: github.event_name != 'pull_request'
        run: python3 -B tools/project_status.py --live
